<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Кадры детектора уровней</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="levelFrames.js"></script>
    <style>
        body {
            font: 13px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
            margin: 0 12px;
        }

        #stepper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        #stepper button {
            font-size: 16px;
            width: 36px;
            height: 28px;
            cursor: pointer;
        }

        #slider {
            flex: 1 1 280px;
            min-width: 200px;
        }

        #caption {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        #legend span {
            margin-right: 10px;
            white-space: nowrap;
        }

        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 3px;
            vertical-align: middle;
        }

        .hint {
            color: #5f6368;
        }
    </style>
</head>
<body>
<!-- Кадры LevelDetectorSimulation, по одному на окно, со стрелками и ползунком. Результаты симуляции
     стратегии - на PriceChart.html: пока обе картинки делили одну страницу, оставшийся от детектора
     файл кадров закрывал собой прогон. -->
<div id="stepper">
    <button id="back" title="Шаг назад (←, с Shift — на десять)">←</button>
    <button id="forward" title="Шаг вперёд (→, с Shift — на десять)">→</button>
    <input type="range" id="slider" min="0" value="0">
    <span id="caption"></span>
    <label><input type="checkbox" id="projection" checked> продолжение линий</label>
    <label><input type="checkbox" id="fixedScale"> общая шкала</label>
</div>
<div id="legend" class="hint"></div>
<div id="price_chart" style="width: 100%; height: 800px"></div>
<!-- Под ценой, на тех же строках кадра: RSI(14) по часам с уровнями 20 и 70. -->
<div id="rsi_chart" style="width: 100%; height: 200px" hidden></div>
</body>
</html>
