<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Результат симуляции</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="priceChart.js"></script>
    <style>
        body {
            font: 13px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
            margin: 0 12px;
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        #span, #missing, .hint {
            color: #5f6368;
        }

        #missing {
            padding: 12px 0;
        }

        /* Все три графика внутри одной прокрутки и одной ширины: у категориальной оси нет общего
           масштаба, и разъехаться они могут только если прокручивать их порознь. */
        #scroller {
            overflow-x: auto;
            overflow-y: hidden;
        }
    </style>
</head>
<body>
<!-- Результат симуляции: цена с заявками, RSI и объём. Кадры детектора уровней - на LevelFrames.html. -->
<div id="controls">
    <label>масштаб
        <select id="zoom">
            <option value="1" selected>по окну</option>
            <option value="3">втрое шире</option>
            <option value="10">вдесятеро</option>
            <option value="30">максимум</option>
        </select>
    </label>
    <span id="span"></span>
    <span class="hint">прокрутка по горизонтали — Shift + колесо</span>
</div>
<div id="missing" hidden></div>
<div id="scroller">
    <div id="price_chart" style="height: 800px"></div>
    <!-- RSI(14) по точкам самого графика, а не по часам: шаг точки написан в подписи. -->
    <div id="rsi_chart" style="height: 160px"></div>
    <div id="volume_chart" style="height: 220px"></div>
</div>
</body>
</html>
